<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
{{ partial "footer.html" . }}
{{ with resources.Get "ts/main.ts" | js.Build (dict "minify" true "target" "es2020") | fingerprint }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
{{ end }}
</body>
</html>
