{{- $sec := .Section -}}
<header class="site-header">
  <div class="bar">
    <a class="brand" href="{{ "/" | relURL }}"><img src="{{ "brand/symbol.png" | relURL }}" srcset="{{ "brand/symbol.png" | relURL }} 1x, {{ "brand/symbol@2x.png" | relURL }} 2x" width="34" alt="글루시스"><span class="txt"><span class="name">TECH-G</span><span class="by">글루시스 기술 블로그</span></span></a>
    <nav class="nav" id="site-nav" aria-label="주 메뉴">
      <a href="/posts/"{{ if or (eq .RelPermalink "/posts/") (eq $sec "blog") }} aria-current="page"{{ end }}>글</a>
      <a href="/tags/"{{ if or (eq .Kind "taxonomy") (eq .Kind "term") }} aria-current="page"{{ end }}>태그</a>
      <a href="/about/"{{ if eq .RelPermalink "/about/" }} aria-current="page"{{ end }}>소개</a>
      <a href="{{ site.Params.careersURL }}">채용</a>
    </nav>
    <button class="nav-search" type="button" aria-label="글 검색"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="lbl">글 검색</span><kbd>/</kbd></button>
    <button class="theme-btn" type="button" aria-label="어두운 화면으로 전환" aria-pressed="false"><svg class="i-moon" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true" focusable="false"><path d="M16.5 11.8A7 7 0 0 1 8.2 3.5a7 7 0 1 0 8.3 8.3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><svg class="i-sun" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 1.8v2.3M10 15.9v2.3M1.8 10h2.3M15.9 10h2.3M4.2 4.2l1.6 1.6M14.2 14.2l1.6 1.6M15.8 4.2l-1.6 1.6M5.8 14.2l-1.6 1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <button class="menu-btn" type="button" aria-label="메뉴" aria-expanded="false" aria-controls="site-nav">☰</button>
  </div>
</header>
