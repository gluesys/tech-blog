{{- /* Sticky table of contents (h2-h3, links to the existing heading ids) plus
       share buttons. Hidden when the post has fewer than 2 headings. */ -}}
<aside class="toc" data-pagefind-ignore>
  {{- if ge (len (findRE `<a ` .TableOfContents)) 2 }}
  <div class="toc-nav">
    <b>목차</b>
    {{ .TableOfContents }}
  </div>
  {{- end }}
  <div class="share">
    <button type="button" data-share data-url="{{ .Permalink }}" data-title="{{ .Title }}">링크 복사</button>
  </div>
</aside>
