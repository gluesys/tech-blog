baseURL = "https://tech.gluesys.com/"
locale = "ko"
title = "TECH-G"
publishDir = "build"
timeZone = "UTC"
disablePathToLower = true
enableEmoji = true

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser]
# A paragraph holding only an image reaches render-image.html as a block (.IsBlock),
# which centres it by default; the hook writes the <p> back itself.
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
title = true

[markup.goldmark.extensions]
# kramdown never autolinked bare URLs.
linkify = false

[markup.goldmark.extensions.footnote]
enable = true
# kramdown's backlink is a bare U+21A9 without the text variation selector.
backlinkHTML = "&#8617;"

# The typographer stays on: kramdown also curled quotes and dashes, and turning
# it off adds 13 body-text differences against the live site.

[markup.highlight]
noClasses = false
# Line numbers are opt-in per block: ```bash {linenos=true linenostart=10}. Inline
# numbers (not a table) keep one <pre>, so wrapping and the copy button stay simple.
lineNumbersInTable = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

# Blog posts are plain files (/blog/2026/12/01/new-post.html), as on Jekyll.
# Converted posts carry an explicit `url`. New posts have no `url` and no
# front-matter `date`: the date and the slug come from the file name
# (YYYY-MM-DD-slug.md). `:slugorfilename` only drops the date prefix when the
# date was taken from the file name, so a new post must not set `date`.
[permalinks]
blog = "/blog/:year/:month/:day/:slugorfilename"

[uglyURLs]
blog = true

[frontmatter]
date = [":default", ":filename"]

[taxonomies]
tag = "tags"

# Related posts: shared tags dominate, publication year breaks ties.
[related]
includeNewer = true
threshold = 50
toLower = true
  [[related.indices]]
  name = "tags"
  weight = 100
  [[related.indices]]
  name = "date"
  weight = 10
  pattern = "2006"

[pagination]
pagerSize = 20

# RSS 2.0 lives at /feed.xml only. The built-in "rss" format (index.xml in
# every section and term) is not listed for any kind.
[outputFormats.feed]
mediaType = "application/rss+xml"
baseName = "feed"

[outputs]
home = ["html", "feed"]
section = ["html"]
taxonomy = ["html"]
term = ["html"]
page = ["html"]

[params]
careersURL = "https://gluesys.com/company/recruit/"
description = "소프트웨어로 스토리지를 만드는 개발자들의 이야기. 글루시스 기술 블로그 TECH-G"

# giscus comments. The owner fills repoId and categoryId at cutover, after
# enabling Discussions and installing the giscus app (see giscus.app). While
# either is empty, no comment markup or script is rendered.
[params.giscus]
repo = "gluesys/tech-blog"
repoId = ""
category = "Comments"
categoryId = ""
mapping = "pathname"
lang = "ko"
